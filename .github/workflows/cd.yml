
name: CD - Deploy Database Changes

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Liquibase
        uses: liquibase/setup-liquibase@v2
        with:
          version: '5.0.4'
          edition: 'community'

      - name: Install Databricks extensions
        run: |
          liquibase lpm add liquibase-databricks databricks-jdbc --global --skip-existing

      - name: Validate changelog
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
        run: |
          liquibase \
            --changelog-file=changelog/db.changelog-master.yaml \
            --url="jdbc:databricks://${DATABRICKS_HOST}:443;transportMode=http;ssl=1;httpPath=${DATABRICKS_HTTP_PATH};AuthMech=3;UID=token;PWD=${DATABRICKS_TOKEN};ConnCatalog=${DATABRICKS_CATALOG};ConnSchema=default;" \
            validate

      - name: Deploy pending changesets
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
        run: |
          liquibase \
            --changelog-file=changelog/db.changelog-master.yaml \
            --url="jdbc:databricks://${DATABRICKS_HOST}:443;transportMode=http;ssl=1;httpPath=${DATABRICKS_HTTP_PATH};AuthMech=3;UID=token;PWD=${DATABRICKS_TOKEN};ConnCatalog=${DATABRICKS_CATALOG};ConnSchema=default;" \
            update

      - name: Confirm database status
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
        run: |
          liquibase \
            --changelog-file=changelog/db.changelog-master.yaml \
            --url="jdbc:databricks://${DATABRICKS_HOST}:443;transportMode=http;ssl=1;httpPath=${DATABRICKS_HTTP_PATH};AuthMech=3;UID=token;PWD=${DATABRICKS_TOKEN};ConnCatalog=${DATABRICKS_CATALOG};ConnSchema=default;" \
            status --verbose
